name: CI/CD

# api-tests and web-build run on every push/PR to main and gate everything
# else. deploy only runs on a push TO main, and only actually does anything
# once DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY secrets exist (Settings ->
# Secrets and variables -> Actions) — until then it shows as skipped, not
# failed, so this file can land before a server does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Wait for mongo
        # Service containers start before the job's steps do, and checkout +
        # setup-python + pip install already take longer than mongod needs to
        # become ready — this is just cheap insurance against the rare case
        # where it isn't, without fighting service-container health-cmd
        # shell-quoting for a mongosh --eval one-liner.
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/27017) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "mongo did not come up on :27017" >&2
          exit 1

      - name: black --check
        working-directory: api
        run: python -m black --check app tests

      - name: ruff check
        working-directory: api
        run: python -m ruff check app tests

      - name: pytest
        working-directory: api
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/sakshya_test
        run: python -m pytest -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck + build
        working-directory: web
        run: npm run build

  deploy:
    needs: [api-tests, web-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      # `secrets` isn't a valid context in a job-level `if:` (github rejects
      # the whole workflow file, 0 jobs run, if you try) — only steps can
      # read it, hence this indirection: every later step gates on this
      # step's output instead, so the job exists (and needs/api-tests +
      # web-build still block it) but does nothing until a server does.
      - name: Check deploy secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — add DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY in Settings > Secrets and variables > Actions to enable it."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.ready == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push deploy/Dockerfile
        if: steps.check.outputs.ready == 'true'
        # deploy/Dockerfile's own ARG defaults (VITE_API_MODE=live,
        # VITE_API_BASE_URL=/api) already match this single-container shape
        # (nginx reverse-proxies /api/* to the api process inside the same
        # container), so no build-args override needed here.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sakshya:latest
            ghcr.io/${{ github.repository_owner }}/sakshya:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/sakshya:latest
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "IMAGE='$IMAGE' bash -s" <<'REMOTE'
            set -euo pipefail
            docker pull "$IMAGE"
            docker stop sakshya 2>/dev/null || true
            docker rm sakshya 2>/dev/null || true
            # /opt/sakshya/.env is a one-time manual setup on the server
            # (real PHOTO_PUBLIC_BASE_URL/THEMATIC_PUBLIC_BASE_URL/
            # CORS_ORIGINS for that host) — CD only ever ships the image,
            # never that file, so redeploys can't clobber server-specific
            # config with values baked at some other time.
            docker run -d \
              --name sakshya \
              --restart unless-stopped \
              -p 80:80 \
              --env-file /opt/sakshya/.env \
              -v sakshya_mongo_data:/data/db \
              -v sakshya_photos:/app/api/app/static/photos \
              "$IMAGE"
            docker image prune -f
          REMOTE

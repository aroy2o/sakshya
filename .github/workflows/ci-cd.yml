name: CI/CD

# api-tests and web-build run on every push/PR to main and gate everything
# else. deploy only runs on a push TO main, and only actually does anything
# once DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY secrets exist (Settings ->
# Secrets and variables -> Actions) — until then it shows as skipped, not
# failed, so this file can land before a server does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets someone trigger a deploy from the Actions tab without an empty
  # commit — useful for the very first deploy right after adding the
  # DEPLOY_* secrets, when there's no new code change to push yet.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Wait for mongo
        # Service containers start before the job's steps do, and checkout +
        # setup-python + pip install already take longer than mongod needs to
        # become ready — this is just cheap insurance against the rare case
        # where it isn't, without fighting service-container health-cmd
        # shell-quoting for a mongosh --eval one-liner.
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/27017) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "mongo did not come up on :27017" >&2
          exit 1

      - name: black --check
        working-directory: api
        run: python -m black --check app tests

      - name: ruff check
        working-directory: api
        run: python -m ruff check app tests

      - name: pytest
        working-directory: api
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/sakshya_test
        run: python -m pytest -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck + build
        working-directory: web
        run: npm run build

  # Publishes the image only. The server pulls it itself: a systemd timer
  # (sakshya-update.timer, checks every 5 min) runs /usr/local/bin/sakshya-update,
  # which recreates the container when the image changed. No inbound SSH from
  # GitHub runners is needed, so port 22 stays locked to admin IPs.
  # See docs/DEPLOYMENT.md.
  publish:
    needs: [api-tests, web-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency: publish-image
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push deploy/Dockerfile
        # deploy/Dockerfile's own ARG defaults (VITE_API_MODE=live,
        # VITE_API_BASE_URL=/api) already match this single-container shape
        # (nginx reverse-proxies /api/* to the api process inside the same
        # container), so no build-args override needed here.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sakshya:latest
            ghcr.io/${{ github.repository_owner }}/sakshya:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

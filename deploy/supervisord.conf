; All three SAKSHYA processes (mongod, the FastAPI api, nginx serving web +
; reverse-proxying /api/) under one supervisord, inside deploy/Dockerfile's
; single container. Logs go to stdout/stderr (maxbytes=0 disables rotation,
; which doesn't apply to those special files anyway) so `docker logs` shows
; everything from all three processes in one stream.

[program:mongod]
command=mongod --dbpath /data/db --bind_ip_all
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
; wait-for-mongo.sh polls mongod, then execs uvicorn — see that file's own
; header comment for why the wait matters (supervisord's default 3-retry
; limit vs. mongod's real startup time).
command=/app/wait-for-mongo.sh
directory=/app/api
autostart=true
autorestart=true
priority=2
environment=MONGO_URI="mongodb://127.0.0.1:27017/sakshya"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

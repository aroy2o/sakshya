# Single-container variant of web/nginx.conf — the only difference is the
# proxy target: mongo/api/nginx all run in the same container here (see
# deploy/Dockerfile + deploy/supervisord.conf), so the api is reachable on
# 127.0.0.1, not a docker-compose service name.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Local dev + test MongoDB — this repo has no Atlas/cloud Mongo credentials
# available in the autonomous-run environment. A single mongod hosts two
# logical databases (sakshya / sakshya_test) rather than two containers —
# databases are natively isolated namespaces in Mongo, so this gets the same
# separation the old Postgres setup got from two containers, with less to run.
# MONGO_URI / MONGO_URI_TEST in .env differ only in the db-name path segment.
#
# No auth configured (Mongo's default, simplest local mode) — this is a
# localhost-only dev substitute, same trust boundary the old sakshya/sakshya
# Postgres credentials had. Swap in a real connection string (with
# username:password@...&authSource=admin) for a shared/production/Atlas
# instance at deploy time - zero code changes, it's just MONGO_URI.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Host port 27018, not 27017: this environment already has a system
      # mongod bound to 27017.
      - "27018:27017"
    volumes:
      - sakshya_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sakshya_mongodata:

# Single-origin deploy shape: this is the only port exposed to the outside
# world. It serves the built SPA and reverse-proxies every backend call to
# the api container so the browser never needs to know the api's address.
#
# /api/ is stripped before proxying so FastAPI's own routes (mounted at
# their real paths — /mws, /assets, /static/photos, etc., see
# api/app/main.py) need zero code change; only VITE_API_BASE_URL=/api
# (set at build time in web/Dockerfile) changes on the frontend side.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing resolves any non-/api path itself.
    location / {
        try_files $uri /index.html;
    }
}
